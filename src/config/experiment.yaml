## LLM settings ##
vllm_model: mistralai/Devstral-2-123B-Instruct-2512
vllm_server_model_name: Devstral-2-123B-Instruct-2512
vllm_embedding_model: Qwen/Qwen3-Embedding-4B
vllm_embedding_server_model_name: Qwen3-Embedding-4B
vllm_api_url: http://localhost:8000/v1
vllm_gpu_memory_utilization: 0.95
vllm_max_model_len: 32768
vllm_max_tokens: 32768
vllm_tensor_parallel_size: 8

## Timeouts ##
vllm_server_timeout: 600
semantic_check_timeout: 30
correctness_check_timeout: 300

## Agent settings ##
# rag | openhands
agent_type: rag
# php | [... other languages not yet supported]
language: php

## Experiment configurations ##
run_size: 20
max_semantic_retries: 5
max_correctness_retries: 5

## SonarQube ##
sq_url: http://localhost:9000
